<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>(╬▔皿▔)╯</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .topbar {
    background: #fff;
    border-bottom: 1px solid #e8e8e6;
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .topbar-title { font-size: 14px; font-weight: 600; color: #1a1a1a; letter-spacing: -0.3px; margin-right: 8px; }
  .topbar-sep { width: 1px; height: 20px; background: #e8e8e6; }
  .bg-label { font-size: 12px; color: #888; font-weight: 500; }

  .bg-btn {
    height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid #e0e0de;
    background: #fff; font-size: 12px; font-weight: 500; color: #444; cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: all 0.15s; white-space: nowrap;
  }
  .bg-btn:hover { background: #f5f5f3; border-color: #ccc; }
  .bg-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  .bg-swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.12); flex-shrink: 0; }

  .checkerboard-swatch {
    background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%);
    background-size: 8px 8px; background-position: 0 0, 0 4px, 4px -4px, -4px 0px; background-color: #fff;
    width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0;
  }

  .save-btn {
    margin-left: auto; height: 32px; padding: 0 16px; border-radius: 7px; border: none;
    background: #1a1a1a; color: #fff; font-size: 13px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: background 0.15s;
  }
  .save-btn:hover { background: #333; }
  .save-btn:disabled { background: #bbb; cursor: not-allowed; }

  .main { display: flex; flex: 1; overflow: hidden; }

  .panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .panel-header {
    padding: 10px 16px 8px; font-size: 11px; font-weight: 600; color: #999;
    letter-spacing: 0.5px; text-transform: uppercase; background: #fafaf8;
    border-bottom: 1px solid #eee; flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  }

  .editor-panel { border-right: 1px solid #e8e8e6; }

  .editor-container {
    display: flex;
    flex: 1;
    overflow: hidden;
    background: #fafaf8;
  }

  .line-numbers {
    padding: 16px 8px;
    font-family: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #b0b0b0;
    text-align: right;
    background: #f5f5f3;
    border-right: 1px solid #e8e8e6;
    user-select: none;
    overflow: hidden;
    min-width: 40px;
  }

  #code-editor {
    flex: 1; border: none; outline: none; resize: none;
    font-family: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
    font-size: 13px; line-height: 1.6; color: #2d2d2d; background: transparent;
    padding: 16px; tab-size: 2; overflow: auto;
    white-space: pre; 
  }

  .preview-panel { background: #f0f0ee; }
  .preview-panel .panel-header { background: #f0f0ee; border-bottom: 1px solid #e4e4e2; }

  .preview-outer {
    flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 24px;
  }

  .preview-inner { position: relative; min-width: 100px; min-height: 60px; max-width: 100%; }

  .checkerboard {
    background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%);
    background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0px; background-color: #fff;
  }

  #preview-content { min-width: 60px; min-height: 40px; display: inline-block; }

  .scale-info { font-size: 10px; color: #bbb; margin-left: auto; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 8px;
    font-size: 13px; font-weight: 500; opacity: 0; transition: all 0.25s;
    pointer-events: none; z-index: 9999; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .saving-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.7);
    display: none; align-items: center; justify-content: center;
    z-index: 9998; font-size: 14px; color: #555; gap: 10px; backdrop-filter: blur(2px);
  }
  .saving-overlay.show { display: flex; }
  .spinner { width: 18px; height: 18px; border: 2px solid #ddd; border-top-color: #555; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">HTML → Image</span>
  <div class="topbar-sep"></div>
  <span class="bg-label">배경</span>

  <button class="bg-btn active" id="btn-white" onclick="setBg('white')">
    <span class="bg-swatch" style="background:#fff"></span> 흰색
  </button>
  <button class="bg-btn" id="btn-black" onclick="setBg('black')">
    <span class="bg-swatch" style="background:#1a1a1a"></span> 검은색
  </button>
  <button class="bg-btn" id="btn-transparent" onclick="setBg('transparent')">
    <span class="checkerboard-swatch"></span> 투명
  </button>
  <button class="bg-btn" id="btn-custom" onclick="document.getElementById('customColor').click()">
    <span class="bg-swatch" id="custom-swatch" style="background:#6366f1"></span> 색상 지정
  </button>
  <input type="color" id="customColor" style="position:absolute;width:0;height:0;opacity:0;" value="#6366f1" oninput="setCustomBg(this.value)">

  <div class="topbar-sep"></div>

  <button class="save-btn" id="saveBtn" onclick="saveImage()">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><polyline points="7 11 12 16 17 11"/><line x1="12" y1="4" x2="12" y2="16"/></svg>
    이미지 저장
  </button>
</div>

<div class="main">
  <div class="panel editor-panel">
    <div class="panel-header">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      HTML 코드
    </div>
    
    <div class="editor-container">
      <div class="line-numbers" id="line-numbers">1</div>
      <textarea id="code-editor" spellcheck="false" placeholder="여기에 HTML 코드를 입력하세요..."></textarea>
    </div>
    
  </div>

  <div class="panel preview-panel">
    <div class="panel-header">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      미리보기
      <span class="scale-info" id="size-info"></span>
    </div>
    <div class="preview-outer">
      <div class="preview-inner" id="preview-inner">
        <div id="preview-content"></div>
      </div>
    </div>
  </div>
</div>

<div class="saving-overlay" id="savingOverlay">
  <div class="spinner"></div>
  <span>이미지 저장 중...</span>
</div>
<div class="toast" id="toast"></div>

<script>
  let currentBg = 'white';
  let customColor = '#6366f1';
  let renderTimer = null;

  const editor = document.getElementById('code-editor');
  const lineNumbers = document.getElementById('line-numbers'); 
  const previewContent = document.getElementById('preview-content');
  const previewInner = document.getElementById('preview-inner');
  const sizeInfo = document.getElementById('size-info');

  const defaultHTML = `<div style="padding: 48px 56px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 20px; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-align: center; box-shadow: 0 24px 64px rgba(102,126,234,0.45);">
  <div style="font-size: 48px; margin-bottom: 16px;">✨</div>
  <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.5px;">HTML → 이미지 에디터</h1>
  <p style="font-size: 1rem; opacity: 0.85; line-height: 1.6;">왼쪽에 HTML 코드를 입력하면<br>그대로 이미지로 저장됩니다</p>
</div>`;

  function updateLineNumbers() {
    const linesCount = editor.value.split('\n').length;
    lineNumbers.innerHTML = Array(linesCount).fill(0).map((_, i) => i + 1).join('<br>');
  }

  editor.addEventListener('scroll', () => {
    lineNumbers.scrollTop = editor.scrollTop;
  });

  editor.value = defaultHTML;
  updateLineNumbers(); 
  renderPreview();

  editor.addEventListener('input', () => {
    updateLineNumbers();
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderPreview, 300);
  });

  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = editor.selectionStart, end = editor.selectionEnd;
      editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = s + 2;
      updateLineNumbers(); 
    }
  });

  function renderPreview() {
    previewContent.innerHTML = editor.value.trim();
    setTimeout(() => {
      const w = previewContent.offsetWidth, h = previewContent.offsetHeight;
      if (w > 0 && h > 0) sizeInfo.textContent = `${w} × ${h}px`;
    }, 100);
  }

  function setBg(type) {
    currentBg = type;
    document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + type).classList.add('active');
    applyBg();
  }

  function setCustomBg(color) {
    customColor = color;
    document.getElementById('custom-swatch').style.background = color;
    currentBg = 'custom';
    document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-custom').classList.add('active');
    applyBg();
  }

  function applyBg() {
    previewContent.style.background = '';
    previewInner.classList.remove('checkerboard');
    if (currentBg === 'white') {
      previewContent.style.background = '#ffffff';
    } else if (currentBg === 'black') {
      previewContent.style.background = '#1a1a1a';
    } else if (currentBg === 'transparent') {
      previewContent.style.background = 'transparent';
      previewInner.classList.add('checkerboard');
    } else if (currentBg === 'custom') {
      previewContent.style.background = customColor;
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ⚠️ html-to-image 라이브러리를 사용한 확실한 저장 로직 ⚠️
  function saveImage() {
    const btn = document.getElementById('saveBtn');
    const overlay = document.getElementById('savingOverlay');
    if (!editor.value.trim()) { showToast('⚠️ HTML 코드를 입력해주세요'); return; }

    btn.disabled = true;
    overlay.classList.add('show');

    const bgColor = currentBg === 'transparent' ? null :
      currentBg === 'white' ? '#ffffff' :
      currentBg === 'black' ? '#1a1a1a' : customColor;

    htmlToImage.toPng(previewContent, {
      backgroundColor: bgColor,
      pixelRatio: 2 // 고화질 출력 (기존 scale: 2와 동일 역할)
    })
    .then(function (dataUrl) {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'image_' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('✅ 이미지가 저장되었습니다');
    })
    .catch(function (error) {
      console.error('저장 중 오류 발생:', error);
      showToast('❌ 저장 중 오류가 발생했습니다');
    })
    .finally(function () {
      btn.disabled = false;
      overlay.classList.remove('show');
    });
  }

  applyBg();
</script>
</body>
</html>
